server:
  # SERVER_PORT is the REST API's internal port. Render (and most single-port PaaS)
  # only exposes ONE public port per service — the bundled Dockerfile runs a small
  # Nginx in front that binds Render's $PORT and routes /socket.io/* to the
  # Socket.IO server and everything else here, so this can stay fixed at 5000.
  port: ${SERVER_PORT:${PORT:5000}}

spring:
  application:
    name: commengine
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/commengine}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      # Auto-create / update tables (wallets, wallet_transactions, game_bets, ...) on every startup.
      # Hard-coded to `update` so a stray JPA_DDL_AUTO env var on the host can't turn it off.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    root: INFO
    com.commengine: ${LOG_LEVEL:INFO}

app:
  client-url: ${CLIENT_URL:*}
  jwt:
    secret: ${JWT_SECRET:change_me}
    expires-in: ${JWT_EXPIRES_IN:30d}
    temp-expires-in: ${JWT_TEMP_EXPIRES_IN:15m}
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  agora:
    app-id: ${AGORA_APP_ID:}
    app-certificate: ${AGORA_APP_CERTIFICATE:}
    token-expiry-seconds: ${AGORA_TOKEN_EXPIRY_SECONDS:3600}
  cashfree:
    app-id: ${CASHFREE_APP_ID:}
    secret-key: ${CASHFREE_SECRET_KEY:}
    env: ${CASHFREE_ENV:SANDBOX}            # set PRODUCTION on Render when going live
    public-base-url: ${PUBLIC_BASE_URL:https://commengine-springboot-vyrz.onrender.com}
  socketio:
    host: ${SOCKETIO_HOST:0.0.0.0}
    port: ${SOCKETIO_PORT:5001}

# ---- Admin panel (separate from phone/OTP users) ---------------------------------------------
# Admins live in their own `admins` table and sign in with username + password (no OTP).
# The FIRST admin is created from these two env vars, but only while the admins table is empty.
admin:
  jwt:
    expiration-ms: ${ADMIN_JWT_EXPIRATION_MS:10800000}        # 3 hours
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  login:
    max-attempts: ${ADMIN_LOGIN_MAX_ATTEMPTS:5}
    window-minutes: ${ADMIN_LOGIN_WINDOW_MINUTES:10}
    lockout-minutes: ${ADMIN_LOGIN_LOCKOUT_MINUTES:15}
