<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store admin</title>
<style>
  :root { --ink:#2a1b4d; --dim:#7c6f9e; --line:#e7dcfa; --bg:#fff7fc; --card:#fff; --pri:#7b4dff; --bad:#d6324f; --ok:#12915a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; } h2 { font-size:16px; margin:0 0 8px; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); cursor:pointer; color:var(--dim); font-weight:600; }
  .tab.on { background:var(--pri); border-color:var(--pri); color:#fff; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input[type=text], input[type=number], input[type=password], input[type=color] { width:100%; max-width:340px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  input[type=color] { padding:2px; height:36px; width:60px; }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--pri); color:#fff; font-weight:700; cursor:pointer; }
  button.ghost { background:#efe9ff; color:var(--pri); } button.danger { background:#ffe3e8; color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .rules { background:#f7f2ff; border-radius:8px; padding:10px 12px 10px 28px; margin:6px 0 0; color:var(--dim); font-size:13px; }
  .rules li { margin:2px 0; }
  .file { border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-top:12px; }
  .file b { display:block; } .hint { color:var(--dim); font-size:12px; }
  .msg { margin:10px 0 0; padding:8px 10px; border-radius:8px; font-weight:600; }
  .msg.err { background:#ffe3e8; color:var(--bad); } .msg.ok { background:#dff7ea; color:var(--ok); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .item { border:1px solid var(--line); border-radius:12px; padding:10px; background:#fff; }
  .thumb { height:130px; display:flex; align-items:center; justify-content:center; background:repeating-conic-gradient(#f1ecfb 0% 25%, #fff 0% 50%) 50%/16px 16px; border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .thumb img { max-width:100%; max-height:100%; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#efe9ff; color:var(--pri); }
  .badge.free { background:#dff7ea; color:var(--ok); } .badge.off { background:#eee; color:#777; }
  #login { max-width:360px; margin:80px auto; }
  .hidden { display:none !important; }
  .inline { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="login" class="card hidden">
  <h2>Admin sign in</h2>
  <label>Username</label><input type="text" id="u" autocomplete="username">
  <label>Password</label><input type="password" id="p" autocomplete="current-password">
  <div class="row"><button id="loginBtn">Sign in</button></div>
  <div id="loginMsg"></div>
</div>

<div id="app" class="hidden">
  <header><h1>Store admin</h1><button class="ghost" id="logout">Sign out</button></header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="card" id="uploadCard">
      <h2 id="uploadTitle">Add item</h2>
      <div id="rules"></div>
      <label>Name</label><input type="text" id="name" maxlength="60">
      <div class="inline">
        <div><label>Price</label>
          <div class="inline"><label style="margin:0;font-weight:500"><input type="checkbox" id="free"> Free for everyone</label></div></div>
        <div id="priceBox"><label>Price per day (coins)</label><input type="number" id="price" min="1" step="1"></div>
        <div><label>Sort order</label><input type="number" id="sort" value="0" step="1" style="width:100px"></div>
      </div>
      <div id="extraBubble" class="hidden"><label>Message text colour</label><input type="color" id="textColor" value="#ffffff"></div>
      <div id="extraBg" class="hidden"><label>Darkness over the picture (0 - 0.8)</label><input type="number" id="scrim" min="0" max="0.8" step="0.05" value="0.35" style="width:100px"></div>
      <div id="files"></div>
      <div class="row"><button id="save">Upload</button></div>
      <div id="saveMsg"></div>
    </div>
    <div class="card"><h2 id="listTitle">Items</h2><div class="grid" id="list"></div></div>
  </main>
</div>

<script>
"use strict";
const API = location.origin + "/api/admin";
const CATS = { FRAME: "Avatar frames", BUBBLE: "Chat bubbles", BACKGROUND: "Room backgrounds", ENTRY_EFFECT: "Entry effects" };
let token = sessionStorage.getItem("adminToken") || "";
let specs = {}, cat = "FRAME", picked = {};
const $ = (id) => document.getElementById(id);

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  kids.forEach((k) => e.append(k));
  return e;
}
function show(id, text, ok) { const d = $(id); d.replaceChildren(); if (text) d.append(el("div", { className: "msg " + (ok ? "ok" : "err"), textContent: text })); }

async function call(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  let body = {};
  try { body = await res.json(); } catch (e) { /* not json */ }
  if (res.status === 401) { logout(); throw new Error(body.message || "Signed out"); }
  if (!res.ok || body.success === false) throw new Error(body.message || ("Request failed (" + res.status + ")"));
  return body.data;
}

function logout() { token = ""; sessionStorage.removeItem("adminToken"); $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }

$("loginBtn").onclick = async () => {
  try {
    const res = await fetch(API + "/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || "Sign in failed");
    token = body.data.token; sessionStorage.setItem("adminToken", token);
    start();
  } catch (e) { show("loginMsg", e.message, false); }
};
$("logout").onclick = logout;

async function start() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  const data = await call("/specs");
  specs = Object.fromEntries(data.specs.map((s) => [s.category, s]));
  renderTabs(); selectCat(cat);
}

function renderTabs() {
  $("tabs").replaceChildren(...Object.entries(CATS).map(([k, label]) =>
    el("div", { className: "tab" + (k === cat ? " on" : ""), textContent: label, onclick: () => selectCat(k) })));
}

function selectCat(k) {
  cat = k; picked = {}; renderTabs();
  const spec = specs[cat];
  $("uploadTitle").textContent = "Add " + spec.label.toLowerCase();
  $("listTitle").textContent = CATS[cat];
  $("extraBubble").classList.toggle("hidden", cat !== "BUBBLE");
  $("extraBg").classList.toggle("hidden", cat !== "BACKGROUND");
  $("name").value = ""; $("price").value = ""; $("free").checked = false; $("priceBox").classList.remove("hidden");
  show("saveMsg", "");
  // the rules, straight from the server
  $("rules").replaceChildren();
  $("files").replaceChildren(...spec.files.map((f) => {
    const input = el("input", { type: "file", accept: f.field === "video" ? "video/mp4" : (f.format.startsWith("PNG (") ? "image/png" : "image/png,image/jpeg") });
    const note = el("div", { className: "hint" });
    input.onchange = () => checkFile(f, input.files[0], note);
    return el("div", { className: "file" }, el("b", { textContent: f.label + " - " + f.format }),
      el("ul", { className: "rules" }, ...f.rules.map((r) => el("li", { textContent: r }))), input, note);
  }));
  loadList();
}

$("free").onchange = () => $("priceBox").classList.toggle("hidden", $("free").checked);

// Quick checks in the browser so mistakes show up before uploading. The server re-checks everything (and more).
function checkFile(f, file, note) {
  delete picked[f.field]; note.textContent = ""; note.className = "hint";
  if (!file) return;
  const bad = (m) => { note.textContent = m; note.className = "hint"; note.style.color = "var(--bad)"; };
  const good = (m) => { picked[f.field] = file; note.textContent = m; note.style.color = "var(--ok)"; };
  if (file.size > f.maxBytes) return bad("Too big: " + (file.size / 1024).toFixed(0) + " KB (max " + (f.maxBytes / 1024).toFixed(0) + " KB)");
  const url = URL.createObjectURL(file);
  if (f.field === "video") {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => {
      URL.revokeObjectURL(url);
      if (v.videoWidth !== f.width || v.videoHeight !== f.height) return bad("Must be " + f.width + "x" + f.height + " (this is " + v.videoWidth + "x" + v.videoHeight + ")");
      if (v.duration > f.maxSeconds + 0.3) return bad("Too long: " + v.duration.toFixed(1) + " s (max " + f.maxSeconds + " s)");
      good("Looks good (" + v.duration.toFixed(1) + " s). The server will check the rest.");
    };
    v.onerror = () => { URL.revokeObjectURL(url); bad("This browser cannot read the video - is it H.264 MP4?"); };
    v.src = url;
  } else {
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      if (img.naturalWidth !== f.width || img.naturalHeight !== f.height) return bad("Must be " + f.width + "x" + f.height + " (this is " + img.naturalWidth + "x" + img.naturalHeight + ")");
      good("Size OK. The server will check transparency and layout.");
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad("Could not read this image"); };
    img.src = url;
  }
}

$("save").onclick = async () => {
  show("saveMsg", "");
  const spec = specs[cat];
  const fd = new FormData();
  fd.append("category", cat);
  fd.append("name", $("name").value.trim());
  fd.append("free", $("free").checked);
  if (!$("free").checked) fd.append("pricePerDay", $("price").value);
  fd.append("sortOrder", $("sort").value || "0");
  if (cat === "BUBBLE") fd.append("textColor", $("textColor").value);
  if (cat === "BACKGROUND") fd.append("scrim", $("scrim").value);
  for (const f of spec.files) {
    if (!picked[f.field]) return show("saveMsg", "Choose a valid file for: " + f.label, false);
    fd.append(f.field, picked[f.field]);
  }
  $("save").disabled = true;
  try {
    await call("/items", { method: "POST", body: fd });
    show("saveMsg", "Uploaded.", true);
    selectCat(cat);
    show("saveMsg", "Uploaded.", true);
  } catch (e) { show("saveMsg", e.message, false); }
  finally { $("save").disabled = false; }
};

async function loadList() {
  const wanted = cat;
  const data = await call("/items?category=" + wanted);
  if (wanted !== cat) return;
  const list = $("list");
  list.replaceChildren(...(data.items.length ? data.items.map(card) : [el("div", { className: "hint", textContent: "Nothing here yet." })]));
}

function card(i) {
  const thumb = el("div", { className: "thumb" }, el("img", { src: i.thumbUrl || i.imageUrl || "", alt: "" }));
  const badges = el("div", { className: "row" },
    el("span", { className: "badge" + (i.free ? " free" : ""), textContent: i.free ? "FREE" : i.pricePerDay + " coins/day" }),
    ...(i.active ? [] : [el("span", { className: "badge off", textContent: "hidden" })]),
    ...(i.videoUrl ? [el("a", { href: i.videoUrl, target: "_blank", rel: "noopener", textContent: "video" })] : []));
  const act = el("div", { className: "row" },
    el("button", { className: "ghost", textContent: i.active ? "Hide" : "Show", onclick: () => patch(i.id, { active: !i.active }) }),
    el("button", { className: "ghost", textContent: "Edit price", onclick: () => editPrice(i) }),
    el("button", { className: "danger", textContent: "Delete", onclick: () => remove(i) }));
  return el("div", { className: "item" }, thumb, el("b", { textContent: i.name }), badges, act);
}

async function patch(id, fields) {
  const fd = new FormData();
  Object.entries(fields).forEach(([k, v]) => fd.append(k, v));
  try { await call("/items/" + id, { method: "POST", body: fd }); loadList(); } catch (e) { alert(e.message); }
}
function editPrice(i) {
  const v = prompt("Price per day in coins (0 = make it free):", i.free ? "0" : i.pricePerDay);
  if (v === null) return;
  const n = Number(v);
  if (!Number.isInteger(n) || n < 0) return alert("Enter a whole number");
  patch(i.id, n === 0 ? { free: true } : { free: false, pricePerDay: n });
}
async function remove(i) {
  if (!confirm("Delete \"" + i.name + "\"? Users who bought it lose it (no refund).")) return;
  try { await call("/items/" + i.id, { method: "DELETE" }); loadList(); } catch (e) { alert(e.message); }
}

if (token) start().catch(logout); else $("login").classList.remove("hidden");
</script>
</body>
</html>
